databases:
  - name: khakaton-crm-db
    plan: free
    region: frankfurt
    databaseName: khakaton
    user: khakaton
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: autocore-crm-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: khakaton-crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile