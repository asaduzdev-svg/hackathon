<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ServiceCore — simple CRM for service businesses. Manage repair orders, customers and payments from your phone." />
    <title>ServiceCore</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('servicecore.theme')
          var resolve = function (mode) {
            if (mode === 'light' || mode === 'dark') return mode
            var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
            return m && m.matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = resolve(t)
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
